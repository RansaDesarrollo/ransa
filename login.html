  <body class="app auth-page"><a class="visually-hidden-focusable skip-link" href="#auth-form">Skip to sign-in form</a>
    <main class="login-wrap" id="auth-form">
      <div class="login-content">            <div class="auth-brand-wrapper">
                <img class="auth-brand-badge" src="images/brand/ransa-mark.png" alt="Ransa">
                <h1 class="auth-brand-title">Ransa</h1>
                <p class="auth-brand-subtitle">Apps Corporativas</p>
            </div>

            <form name="f" id="loginForm" class="valida" action="valida.php" method="POST">
                <div class="form-group mb-3">
                    <label for="us" class="form-label">Usuario</label>
                    <div class="input-group">
                        <span class="input-group-text" id="us-addon">
                            <i class="fa-solid fa-user" aria-hidden="true"></i>
                        </span>
                        <input type="text" class="form-control" id="us" name="us" placeholder="Ingrese su usuario" autocomplete="username" aria-describedby="us-addon" required autofocus>
                    </div>
                </div>

                <div class="form-group mb-4">
                    <label for="pa" class="form-label">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text" id="pa-addon">
                            <i class="fa-solid fa-lock" aria-hidden="true"></i>
                        </span>
                        <input type="password" class="form-control" id="pa" name="pa" placeholder="Ingrese su contraseña" autocomplete="current-password" aria-describedby="pa-addon" required>
                        <button class="btn btn-toggle-password" type="button" id="btnTogglePassword" tabindex="-1" title="Mostrar/ocultar contraseña">
                            <i class="fa-solid fa-eye" id="togglePasswordIcon" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" id="btnSubmit" class="btn btn-primary btn-login">
                        <i class="fa-solid fa-right-to-bracket me-2" aria-hidden="true"></i> Iniciar Sesión
                    </button>
                </div>
            </form>

      </div>
    </main>
